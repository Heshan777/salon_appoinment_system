---
- name: Deploy and Configure Salon Management Microservices Stack
  hosts: salon_servers
  become: true
  tasks:
    - name: Update apt cache and install prerequisites
      apt:
        name:
          - curl
          - git
          - ca-certificates
          - gnupg
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Ensure Docker is installed
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
      when: ansible_os_family == "Debian"

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Ensure target application directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Copy project docker-compose file
      copy:
        src: ../../docker-compose.yml
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Pull and run microservices via Docker Compose
      command: docker-compose -f {{ app_dir }}/docker-compose.yml up -d --build
      register: compose_output

    - name: Display deployment status
      debug:
        msg: "Microservices stack successfully deployed and running!"
